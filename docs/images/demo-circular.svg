<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200">

  <!-- ── Default theme (cx=72, cy=90, r=54) ───────────────── -->
  <rect x="4" y="4" width="136" height="192" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Track arc: 135°→45°, start(135°)=(33.8,128.2) end(45°)=(110.2,128.2) -->
  <path d="M 33.8 128.2 A 54 54 0 1 1 110.2 128.2" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
  <!-- Progress 65%: angle=135+175.5=310.5°, cos=-0.6494,sin=-0.7604 → x=72+54*0.6494=107.1, y=90+54*(-0.7604)=48.9, 175.5<180 large=0 -->
  <path d="M 33.8 128.2 A 54 54 0 0 1 107.1 48.9" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
  <circle cx="107.1" cy="48.9" r="9" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="72" y="95" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#1e293b">65</text>
  <text x="72" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">0–100</text>
  <text x="72" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#1e293b">Default</text>
  <text x="72" y="190" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">theme</text>

  <!-- ── Material theme (cx=217, cy=90, r=54) ─────────────── -->
  <rect x="149" y="4" width="136" height="192" rx="10" fill="#faf7ff" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M 178.8 128.2 A 54 54 0 1 1 255.2 128.2" fill="none" stroke="#e0e0e0" stroke-width="12" stroke-linecap="round"/>
  <!-- Progress 80%: angle=135+216=351°, cos=0.9877,sin=-0.1564 → x=217+53.3=270.3, y=90-8.4=81.6, 216>180 large=1 -->
  <path d="M 178.8 128.2 A 54 54 0 1 1 270.3 81.6" fill="none" stroke="#6200ea" stroke-width="12" stroke-linecap="round"/>
  <circle cx="270.3" cy="81.6" r="9" fill="#6200ea" stroke="#6200ea" stroke-width="2"/>
  <text x="217" y="95" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#1e293b">80</text>
  <text x="217" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">0–100</text>
  <text x="217" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#1e293b">Material</text>
  <text x="217" y="190" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">theme</text>

  <!-- ── Neumorphic theme (cx=362, cy=90, r=54) ────────────── -->
  <rect x="294" y="4" width="136" height="192" rx="10" fill="#e8edf5" stroke="#d1d9e6" stroke-width="1"/>
  <path d="M 323.8 128.2 A 54 54 0 1 1 400.2 128.2" fill="none" stroke="#d1d9e6" stroke-width="13" stroke-linecap="round"/>
  <!-- Progress 50%: angle=135+135=270°, cos=0, sin=-1 → x=362, y=90-54=36, 135<180 large=0 -->
  <path d="M 323.8 128.2 A 54 54 0 0 1 362 36" fill="none" stroke="#6c63ff" stroke-width="13" stroke-linecap="round"/>
  <circle cx="362" cy="36" r="10" fill="#e0e5ec" stroke="#6c63ff" stroke-width="2.5"/>
  <text x="362" y="95" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#1e293b">50</text>
  <text x="362" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">0–100</text>
  <text x="362" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#1e293b">Neumorphic</text>
  <text x="362" y="190" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#5a6270">theme</text>

  <!-- ── Dark theme (cx=507, cy=90, r=54) ─────────────────── -->
  <rect x="439" y="4" width="136" height="192" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <path d="M 468.8 128.2 A 54 54 0 1 1 545.2 128.2" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <!-- Progress 72%: angle=135+194.4=329.4°, cos=0.867,sin=-0.5 → x=507+46.8=553.8, y=90-27=63, 194.4>180 large=1 -->
  <path d="M 468.8 128.2 A 54 54 0 1 1 553.8 63" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="553.8" cy="63" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="507" y="95" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">72</text>
  <text x="507" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#475569">0–100</text>
  <text x="507" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Dark</text>
  <text x="507" y="190" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#475569">theme</text>
</svg>
