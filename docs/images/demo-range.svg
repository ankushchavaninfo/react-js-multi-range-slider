<svg xmlns="http://www.w3.org/2000/svg" width="640" height="90" viewBox="0 0 640 90">
  <rect width="640" height="90" fill="#f8fafc" rx="8"/>

  <!-- Track -->
  <rect x="30" y="42" width="580" height="5" rx="2.5" fill="#e2e8f0"/>
  <!-- Range fill: min=28% (192.4), max=72% (447.6) -->
  <rect x="192.4" y="42" width="255.2" height="5" rx="0" fill="#3b82f6"/>

  <!-- Tooltip min -->
  <rect x="172" y="12" width="40" height="20" rx="4" fill="#1e293b"/>
  <text x="192" y="25" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="white">28</text>
  <polygon points="188,32 196,32 192,37" fill="#1e293b"/>

  <!-- Tooltip max -->
  <rect x="428" y="12" width="40" height="20" rx="4" fill="#1e293b"/>
  <text x="448" y="25" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="white">72</text>
  <polygon points="444,32 452,32 448,37" fill="#1e293b"/>

  <!-- Min thumb -->
  <circle cx="192.4" cy="44.5" r="10" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Max thumb -->
  <circle cx="447.6" cy="44.5" r="10" fill="white" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="30" y="68" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">0</text>
  <text x="320" y="68" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#475569">28 – 72</text>
  <text x="610" y="68" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#94a3b8">100</text>
</svg>
