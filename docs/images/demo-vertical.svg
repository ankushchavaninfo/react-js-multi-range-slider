<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210">
  <rect width="360" height="210" fill="#f8fafc" rx="8"/>

  <!-- Column labels -->
  <text x="90"  y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b">Bass</text>
  <text x="180" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b">Mid</text>
  <text x="270" y="186" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#64748b">Treble</text>
  <!-- Value labels -->
  <text x="90"  y="200" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">60</text>
  <text x="180" y="200" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">40</text>
  <text x="270" y="200" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">75</text>

  <!-- ── Channel 1: Bass at 60% ──────────────────────── -->
  <!-- Track: x=88, y=18..162, h=144 -->
  <rect x="88" y="18" width="4" height="144" rx="2" fill="#e2e8f0"/>
  <!-- Fill 60% from bottom: top = 18 + 144*(1-0.6) = 18+57.6 = 75.6, h=86.4 -->
  <rect x="88" y="75.6" width="4" height="86.4" rx="2" fill="#2563eb"/>
  <!-- Thumb at cy=75.6 -->
  <circle cx="90" cy="76" r="9" fill="white" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Tooltip left -->
  <rect x="66" y="64" width="18" height="14" rx="3" fill="#1e293b"/>
  <text x="75" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="white" font-weight="600">60</text>
  <polygon points="84,69 84,75 88,72" fill="#1e293b"/>
  <!-- Scale marks -->
  <text x="104" y="22" font-family="system-ui,sans-serif" font-size="9" fill="#cbd5e1">100</text>
  <text x="104" y="166" font-family="system-ui,sans-serif" font-size="9" fill="#cbd5e1">0</text>

  <!-- ── Channel 2: Mid at 40% ──────────────────────── -->
  <rect x="178" y="18" width="4" height="144" rx="2" fill="#e2e8f0"/>
  <!-- Fill 40%: top = 18 + 144*0.6 = 18+86.4 = 104.4, h=57.6 -->
  <rect x="178" y="104.4" width="4" height="57.6" rx="2" fill="#7c3aed"/>
  <circle cx="180" cy="104" r="9" fill="white" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="156" y="92" width="18" height="14" rx="3" fill="#1e293b"/>
  <text x="165" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="white" font-weight="600">40</text>
  <polygon points="174,97 174,103 178,100" fill="#1e293b"/>

  <!-- ── Channel 3: Treble at 75% ──────────────────────── -->
  <rect x="268" y="18" width="4" height="144" rx="2" fill="#e2e8f0"/>
  <!-- Fill 75%: top = 18 + 144*0.25 = 18+36 = 54, h=108 -->
  <rect x="268" y="54" width="4" height="108" rx="2" fill="#0f766e"/>
  <circle cx="270" cy="54" r="9" fill="white" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="246" y="42" width="18" height="14" rx="3" fill="#1e293b"/>
  <text x="255" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="white" font-weight="600">75</text>
  <polygon points="264,47 264,53 268,50" fill="#1e293b"/>
</svg>
