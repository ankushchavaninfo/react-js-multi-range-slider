<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264">

  <!-- ── Theme 1: Default (y=0) ──────────────────────────────────── -->
  <rect x="0" y="0" width="640" height="66" rx="8" fill="#f8fafc"/>
  <text x="20" y="18" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#64748b">DEFAULT</text>
  <rect x="20" y="28" width="600" height="5" rx="2.5" fill="#e2e8f0"/>
  <!-- fill 25%→75%: left=20+0.25*600=170, width=300 -->
  <rect x="170" y="28" width="300" height="5" rx="0" fill="#3b82f6"/>
  <circle cx="170" cy="30.5" r="9" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="470" cy="30.5" r="9" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="20"  y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">0</text>
  <text x="170" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#475569">25</text>
  <text x="470" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#475569">75</text>
  <text x="620" y="52" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">100</text>

  <!-- ── Theme 2: Material (y=66) ──────────────────────────────── -->
  <rect x="0" y="66" width="640" height="66" rx="8" fill="#faf7ff"/>
  <text x="20" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">MATERIAL</text>
  <rect x="20" y="94" width="600" height="3" rx="1.5" fill="#e0e0e0"/>
  <!-- fill 20%→80% -->
  <rect x="140" y="94" width="360" height="3" rx="0" fill="#6200ea"/>
  <circle cx="140" cy="95.5" r="10" fill="#6200ea" stroke="#6200ea" stroke-width="0"/>
  <circle cx="500" cy="95.5" r="10" fill="#6200ea" stroke="#6200ea" stroke-width="0"/>
  <text x="20"  y="118" font-family="system-ui,sans-serif" font-size="10" fill="#9e9e9e">0</text>
  <text x="140" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#424242">20</text>
  <text x="500" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#424242">80</text>
  <text x="620" y="118" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#9e9e9e">100</text>

  <!-- ── Theme 3: Neumorphic (y=132) ────────────────────────────── -->
  <rect x="0" y="132" width="640" height="66" rx="8" fill="#e8edf5"/>
  <text x="20" y="150" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6c63ff">NEUMORPHIC</text>
  <rect x="20" y="160" width="600" height="6" rx="3" fill="#d1d9e6"/>
  <!-- fill 30%→70% -->
  <rect x="200" y="160" width="240" height="6" rx="0" fill="#6c63ff"/>
  <!-- Neumorphic thumbs have soft shadow look -->
  <circle cx="200" cy="163" r="11" fill="#e0e5ec" stroke="#b8bec7" stroke-width="1"/>
  <circle cx="200" cy="163" r="7" fill="#e0e5ec"/>
  <circle cx="440" cy="163" r="11" fill="#e0e5ec" stroke="#b8bec7" stroke-width="1"/>
  <circle cx="440" cy="163" r="7" fill="#e0e5ec"/>
  <text x="20"  y="184" font-family="system-ui,sans-serif" font-size="10" fill="#8892a0">0</text>
  <text x="200" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#5a6270">30</text>
  <text x="440" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#5a6270">70</text>
  <text x="620" y="184" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#8892a0">100</text>

  <!-- ── Theme 4: Dark (y=198) ──────────────────────────────────── -->
  <rect x="0" y="198" width="640" height="66" rx="8" fill="#0f172a"/>
  <text x="20" y="216" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#38bdf8">DARK</text>
  <rect x="20" y="226" width="600" height="5" rx="2.5" fill="#334155"/>
  <!-- fill 35%→65% -->
  <rect x="230" y="226" width="180" height="5" rx="0" fill="#38bdf8"/>
  <circle cx="230" cy="228.5" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="410" cy="228.5" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="20"  y="250" font-family="system-ui,sans-serif" font-size="10" fill="#475569">0</text>
  <text x="230" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">35</text>
  <text x="410" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">65</text>
  <text x="620" y="250" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#475569">100</text>
</svg>
