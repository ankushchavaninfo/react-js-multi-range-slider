name: CI

# Runs on every PR opened/updated against main.
# Blocks merge if the build or type-check fails.

on:
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build library
        run: npm run build
