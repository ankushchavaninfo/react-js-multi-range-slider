name: Release

# Fires every time a commit lands on main (i.e. a PR is merged).
# semantic-release bumps the version, writes CHANGELOG.md, creates a git
# tag, creates a GitHub Release, and publishes to npm via OIDC Trusted
# Publishing (no NPM_TOKEN secret needed).
#
# Commit-type → version bump rules (Conventional Commits):
#   fix:              → patch   (1.0.0 → 1.0.1)
#   feat:             → minor   (1.0.0 → 1.1.0)
#   BREAKING CHANGE:  → major   (1.0.0 → 2.0.0)
#
# Required secrets:
#   GITHUB_TOKEN  — provided automatically by GitHub Actions (no setup needed)

on:
  push:
    branches: [main]

permissions:
  contents: write       # create tags + commits
  issues: write         # comment on issues
  pull-requests: write  # comment on PRs
  id-token: write       # OIDC token for npm Trusted Publishing

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
